version: '3.9'

services:
  traefik:
    image: traefik:v3.0
    container_name: rustpress-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - web

  postgres:
    image: postgres:16-alpine
    container_name: rustpress-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rustcms}
      POSTGRES_USER: ${DB_USER:-rustcms}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rustcms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rustpress-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASS} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: rustpress-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-rustcms}:${DB_PASS}@postgres:5432/${DB_NAME:-rustcms}
      REDIS_URL: redis://:${REDIS_PASS}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: https://${DOMAIN}
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.backend-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.backend-ratelimit.ratelimit.burst=50"
      - "traefik.http.routers.backend.middlewares=backend-ratelimit"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: rustpress-frontend
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  backup-cron:
    image: alpine:3.19
    container_name: rustpress-backup-cron
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER:-rustcms}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME:-rustcms}
    volumes:
      - backups:/backups
    depends_on:
      - postgres
    networks:
      - internal
    command: >
      sh -c "apk add --no-cache postgresql-client &&
             echo '0 2 * * * PGPASSWORD=$$DB_PASS pg_dump -h postgres -U $$DB_USER $$DB_NAME > /backups/auto_$$(date +%Y%m%d_%H%M%S).sql && find /backups -name auto_*.sql -mtime +7 -delete' | crontab - &&
             crond -f"

volumes:
  postgres-data:
  redis-data:
  traefik-certs:
  uploads:
  backups:

networks:
  web:
    external: true
  internal:
    driver: bridge
