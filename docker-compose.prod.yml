version: '3.9'

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: rustcms-postgres
    restart: always
    environment:
      POSTGRES_DB:       rustcms
      POSTGRES_USER:     rustcms
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustcms"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: rustcms-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rustcms-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL:           postgres://rustcms:${DB_PASSWORD}@postgres:5432/rustcms
      REDIS_URL:              redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET:             ${JWT_SECRET}
      JWT_EXPIRY_HOURS:       720
      PORT:                   8080
      SITE_URL:               ${SITE_URL}
      BACKUP_DIR:             /app/backups
      SMTP_HOST:              ${SMTP_HOST}
      SMTP_PORT:              ${SMTP_PORT:-587}
      SMTP_USERNAME:          ${SMTP_USERNAME}
      SMTP_PASSWORD:          ${SMTP_PASSWORD}
      SMTP_FROM:              ${SMTP_FROM}
      STRIPE_SECRET_KEY:      ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET:  ${STRIPE_WEBHOOK_SECRET}
      PAYPAL_CLIENT_ID:       ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET:   ${PAYPAL_CLIENT_SECRET}
      PAYPAL_SANDBOX:         ${PAYPAL_SANDBOX:-false}
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rustcms-frontend
    restart: always
    networks:
      - internal

  nginx:
    image: docker.io/library/nginx:alpine
    container_name: rustcms-nginx
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
      - uploads:/app/uploads:ro
    networks:
      - internal
      - external

  certbot:
    image: docker.io/certbot/certbot
    container_name: rustcms-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  redisdata:
  uploads:
  backups:
  certbot-www:
  certbot-conf:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
