[package]
name = "rustcms"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rustcms"
path = "src/main.rs"

[lib]
name = "rustcms_lib"
path = "src/lib.rs"

[dependencies]
# Web framework
actix-web       = "4"
actix-multipart = "0.6"
actix-files = "0.6"
actix-cors      = "0.7"

# Async runtime
tokio           = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.7", features = [
    "postgres",
    "runtime-tokio-rustls",
    "uuid",
    "chrono",
    "json"
]}

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# IDs & time
uuid    = { version = "1", features = ["serde", "v4"] }
chrono  = { version = "0.4", features = ["serde"] }

# Auth
jsonwebtoken = "9"
bcrypt       = "0.15"

# Traits async
async-trait = "0.1"

# File storage (local + S3-compatible)
object_store = { version = "0.9", features = ["aws"] }
mime         = "0.3"
mime_guess   = "2"

# Logging / tracing
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"

# Config from env / file
config  = "0.14"
dotenvy = "0.15"

# Error handling
thiserror = "1"
anyhow    = "1"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Slugify
slug = "0.1"

# Email
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "builder"] }

# Image optimization
image = { version = "0.25", features = ["jpeg", "png", "webp"] }

# Redis cache
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# HTTP client para webhooks
reqwest = { version = "0.12", features = ["json"] }

# Rate limiting
actix-governor = "0.7"

# Bytes (multipart)
bytes = "1"
futures-util = "0.3"

[dev-dependencies]
actix-rt  = "2"
reqwest   = { version = "0.11", features = ["json"] }
