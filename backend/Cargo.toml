[package]
name = "rustcms"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rustcms"
path = "src/main.rs"

[lib]
name = "rustcms_lib"
path = "src/lib.rs"

[dependencies]
tokio-stream = "0.1"
async-stream = "0.3"
# Web framework
actix-web = "4.13"
actix-multipart = "0.6"
actix-files = "0.6"
actix-ws      = "0.3"
actix-cors      = "0.7"

# Async runtime
tokio           = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio-rustls",
    "uuid",
    "chrono",
    "json"
]}

# Vector search
pgvector = { version = "0.4", features = ["sqlx"] }

# GraphQL
async-graphql = { version = "7", features = ["chrono", "uuid"] }
async-graphql-actix-web = "7"

# OpenAPI
utoipa = { version = "4", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7", features = ["actix-web"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# IDs & time
uuid    = { version = "1", features = ["serde", "v4"] }
chrono  = { version = "0.4", features = ["serde"] }

# Auth
jsonwebtoken = "9"
bcrypt       = "0.15"

# Traits async
async-trait = "0.1"

# File storage (local + S3-compatible)
object_store = { version = "0.10", features = ["aws"] }
mime         = "0.3"
mime_guess   = "2"

# Logging / tracing
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"

# Config from env / file
config  = "0.14"
dotenvy = "0.15"

# Error handling
thiserror = "1"
anyhow    = "1"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Slugify
slug = "0.1"

# Email
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "builder"] }

# Image optimization
image = { version = "0.25", features = ["jpeg", "png", "webp"] }

# Redis cache
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Slug generation

# Decimal
bigdecimal = { version = "0.4", features = ["serde"] }

# Hashing para API keys
sha2 = "0.10"

# HTTP client para webhooks
reqwest = { version = "0.12", features = ["json"] }

# 2FA TOTP
totp-rs = { version = "5", features = ["gen_secret", "qr"] }

# PDF
printpdf = "0.7"

# S3/R2 Backup
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
tokio-cron-scheduler = "0.13"

# Rate limiting
actix-governor = "0.7"

# Bytes (multipart)
bytes = "1"
futures-util = "0.3"

hmac   = "0.12"
hex    = "0.4"
base64 = "0.22"

[dev-dependencies]
actix-rt      = "2"
actix-web     = { version = "4", features = ["macros"] }
tokio         = { version = "1", features = ["full"] }
serde_json    = "1"
