version: '3.9'

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: rustcms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       rustcms
      POSTGRES_USER:     rustcms
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rustcms_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: rustcms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  mailhog:
    image: docker.io/mailhog/mailhog
    container_name: rustcms-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  pgadmin:
    image: docker.io/dpage/pgadmin4
    container_name: rustcms-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

volumes:
  pgdata:
  redisdata:
