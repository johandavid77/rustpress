services:

  # PostgreSQL
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: rustcms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     rustcms
      POSTGRES_PASSWORD: rustcms_secret
      POSTGRES_DB:       rustcms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustcms -d rustcms"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # pgAdmin
  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: rustcms-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL:              admin@rustcms.dev
      PGADMIN_DEFAULT_PASSWORD:           admin
      PGADMIN_CONFIG_SERVER_MODE:         "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro

  # MailHog - SMTP de desarrollo
  mailhog:
    image: docker.io/mailhog/mailhog:latest
    container_name: rustcms-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI


  # Redis - Cache
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: rustcms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
